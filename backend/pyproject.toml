[project]
name = "backend"
version = "0.1.0"
description = "DocsQA backend: FastAPI + LangGraph RAG API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-postgres>=0.0.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
eval = [
    "flashrank>=0.2.10",
    "ragas>=0.4.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows in the report are long by nature.
"eval/*" = ["E501"]
