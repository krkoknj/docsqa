services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://rag:rag@db:5432/rag
      EMBEDDED_WORKER: "false"  # indexing runs in the worker service below
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Indexing worker: same image, different command. Scale with `docker compose up --scale worker=3`.
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment: *backend-env
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000  # /api/* is proxied here by Next.js
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
